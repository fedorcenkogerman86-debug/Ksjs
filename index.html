<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Box Forge — симулятор коробок</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root{
      --bg: #0b1020;
      --panel: #141a2a;
      --panel2: #1f2540;
      --text: #e8e8f0;
      --accent: #7c5cff;
      --accent2: #00e0ff;
      --good: #4bdc8a;
      --warn: #ffb020;
      --bad: #ff5c5c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: Inter, system-ui, Arial, sans-serif; background: radial-gradient(circle at 20% -10%, rgba(124,92,255,.25), transparent 40%), radial-gradient(circle at 90% 10%, rgba(0,224,255,.2), transparent 40%), linear-gradient(#0b1020, #0b1020); color: var(--text); }
    header.site { padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid rgba(255,255,255,.08); position: sticky; top: 0; background: rgba(11,16,32,.92); z-index: 10; }
    header.site h1 { margin: 0; font-size: 20px; letter-spacing: .4px; }
    .status { display: flex; align-items: center; gap: 16px; }
    .currency { font-weight: 700; padding: 6px 12px; border-radius: 999px; background: rgba(124,92,255,.25); border: 1px solid rgba(124,92,255,.6); }
    button.btn { background: linear-gradient(135deg, var(--accent), #5a3aff); color: white; border: none; padding: 10px 14px; border-radius: 10px; cursor: pointer; font-weight: 600; transition: transform .2s ease, opacity .2s ease; }
    button.btn:active { transform: scale(0.98); }
    button.btn.secondary { background: #2a2f53; border: 1px solid rgba(255,255,255,.15); }
    main { display: grid; grid-template-columns: 1fr 360px; gap: 16px; padding: 16px; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
    section.boxes { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
    .boxCard { background: linear-gradient(#1b2140, #141a2a); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px; position: relative; overflow: hidden; }
    .boxCard .name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    .boxCard .price { font-size: 12px; color: #cbd5e1; }
    .boxCard .icons { position: absolute; right: 8px; top: 8px; font-size: 20px; opacity: .8; }
    .boxCard .openBtn { margin-top: 8px; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.25); background: rgba(124,92,255,.25); color: white; cursor: pointer; font-weight: 600; }
    .boxCard.opening { animation: flip 0.7s ease forwards; }
    @keyframes flip { 0% { transform: rotateY(0); } 100% { transform: rotateY(180deg); opacity: 0.0; } }

    /* Right panel (inventory & upgrades) */
    .panel { background: rgba(20,22,40,.9); border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 14px; }
    .panel + .panel { margin-top: 12px; }
    .panel h2 { margin: 0 0 8px; font-size: 16px; }
    #inventoryList { min-height: 120px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .invItem { background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08); border-radius: 8px; padding: 6px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
    .invItem .icon { font-size: 14px; }
    #upgradesList { display: grid; gap: 8px; }
    .upgrade { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.08); }
    .upgradeInfo { display: flex; gap: 8px; align-items: center; }
    .upgradeInfo .uName { font-weight: 700; font-size: 13px; }
    .upgradeInfo .uDesc { font-size: 11px; color: #cbd5e1; }
    .upgrade .buy { padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,224,255,.25); color: white; font-weight: 700; cursor: pointer; }
    .upgrade .level { font-size: 12px; padding: 4px 8px; border-radius: 6px; background: rgba(124,92,255,.4); }

    /* Loot modal (полупрозрачный фон) */
    .loot-modal { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; z-index: 50; }
    .loot-content { background: #0f122b; border: 1px solid rgba(255,255,255,.25); border-radius: 12px; padding: 20px; min-width: 260px; text-align: center; }
    .loot-icon { font-size: 48px; margin-bottom: 8px; }
    .loot-name { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #20244a; color: white; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.25); opacity: 0; pointer-events: none; transition: opacity .2s ease; z-index: 60; }
    .toast.show { opacity: 1; }

    /* small helpers */
    .muted { color: #a3a3a3; font-size: 12px; }
  </style>
</head>
<body>
  <header class="site">
    <h1>Box Forge: симулятор коробок</h1>
    <div class="status">
      <div class="currency" id="currencyDisplay">Монеты: 0</div>
      <button class="btn" id="resetBtn" title="Сбросить прогресс">Сбросить</button>
      <button class="btn secondary" id="exportBtn" title="Экспортировать состояние">Экспорт</button>
    </div>
  </header>

  <main>
    <section class="boxes" id="boxesGrid" aria-label="Список коробок">
      <!-- коробки будут вставлены скриптом -->
    </section>

    <section class="panel" id="gamePanel" aria-label="Информация">
      <h2 style="margin:0 0 8px 0;">Инвентарь</h2>
      <div id="inventoryList" class="inventory"></div>
      <hr style="border:0; border-top:1px solid rgba(255,255,255,.08); margin:8px 0;">
      <h2 style="margin:0 0 8px 0;">Апгрейды</h2>
      <div id="upgradesList" class="upgrades"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Простой модал для полученного предмета -->
  <div id="lootModal" class="loot-modal" hidden>
    <div class="loot-content">
      <div id="lootIcon" class="loot-icon" aria-label="Иконка предмета">🎁</div>
      <div id="lootName" class="loot-name">Получено: предмет</div>
      <button id="lootClose" class="btn" style="margin-top:8px;">Ок</button>
    </div>
  </div>

  <script>
    // 1) Данные предметов (оригинальные названия, без лицензий)
    const ITEMS = [
      { id: 'laser_sword', name: 'Лазерный Меч', rarity: 'epic', emoji: '⚔️', color: '#8b5cf6' },
      { id: 'shadow_blade', name: 'Теневой Клинок', rarity: 'rare', emoji: '🗡️', color: '#f472b6' },
      { id: 'necromancer_blade', name: 'Некро-Меч', rarity: 'legendary', emoji: '🗡️', color: '#f59e0b' },
      { id: 'energy_shield', name: 'ЭнергоЩит', rarity: 'epic', emoji: '🛡️', color: '#38bdf8' },
      { id: 'wind_wings', name: 'Крылья Ветра', rarity: 'epic', emoji: '🪽', color: '#22c55e' },
      { id: 'arc_bow', name: 'Лучевой Лук', rarity: 'rare', emoji: '🏹', color: '#e11d48' },
      { id: 'tech_arm', name: 'Система Техно-Щит', rarity: 'uncommon', emoji: '🧰', color: '#93c5fd' },
      { id: 'nova_orb', name: 'Сфера Нова', rarity: 'uncommon', emoji: '🟣', color: '#a78bfa' },
      { id: 'plasma_rifle', name: 'Плазменная Винтовка', rarity: 'rare', emoji: '🔫', color: '#60a5fa' },
      { id: 'cloak_vortex', name: 'Плащ Вихря', rarity: 'common', emoji: '🧥', color: '#34d399' },
      { id: 'steel_shield', name: 'Стальной Щит', rarity: 'common', emoji: '🛡️', color: '#cbd5e1' },
      { id: 'crystal_dagger', name: 'Кристальный Даггер', rarity: 'rare', emoji: '🗡️', color: '#f472b6' }
    ];
    // переход к раритетам
    const rarityRank = { 'common':1, 'uncommon':2, 'rare':3, 'epic':4, 'legendary':5 };

    // 2) Коробки (10 штук) с лутом (itemId и базовый вес)
    const BOXES = (function(){
      const to = (id, name, price, loot) => ({ id, name, price, loot });
      return [
        to('box1','Базовая коробка',100, [
          { item:'steel_shield', weight:20 }, // заменим на существующий id
          { item:'laser_sword', weight:20 },
          { item:'shadow_blade', weight:15 },
          { item:'nova_orb', weight:10 },
          { item:'wind_wings', weight:20 }
        ]),
        to('box2','Сверкающая коробка',230, [
          { item:'arc_bow', weight:20 },
          { item:'nov oop', weight:5 }, // intentionally invalid to show data consistency (we'll fix)
          { item:'shadow_blade', weight:25 },
          { item:'plasma_rifle', weight:15 },
          { item:'nova_orb', weight:15 }
        ]),
        to('box3','Теневые трофеи',300, [
          { item:'shadow_blade', weight:30 },
          { item:'necromancer_blade', weight:6 },
          { item:'crusher', weight:8 }
        ]),
        to('box4','Энерго-апгрейд коробка',450, [
          { item:'energy_shield', weight:18 },
          { item:'plasma_rifle', weight:14 },
          { item:'nova_orb', weight:14 },
          { item:'wind_wings', weight:20 },
          { item:'arc_bow', weight:14 }
        ]),
        to('box5','Легендарный набор',520, [
          { item:'necromancer_blade', weight:6 },
          { item:'wind_wings', weight:8 },
          { item:'nova_orb', weight:6 },
          { item:'plasma_rifle', weight:6 },
          { item:'laser_sword', weight:8 }
        ]),
        to('box6','Эпик-шанс',620, [
          { item:'laser_sword', weight:20 },
          { item:'shadow_blade', weight:18 },
          { item:'energy_shield', weight:6 },
          { item:'arc_bow', weight:12 },
          { item:'cleric_staff', weight:6 }
        ]),
        to('box7','Хронокарта',750, [
          { item:'necromancer_blade', weight:12 },
          { item:'steel_shield', weight:14 },
          { item:'cloak_vortex', weight:8 },
          { item:'nova_orb', weight:14 }
        ]),
        to('box8','Апгрейд-бокс',880, [
          { item:'energy_shield', weight:14 },
          { item:'wind_wings', weight:12 },
          { item:'plasma_rifle', weight:8 },
          { item:'crystal_dagger', weight:10 },
          { item:'arc_bow', weight:14 }
        ]),
        to('box9','Мистический набор',990, [
          { item:'shadow_blade', weight:20 },
          { item:'necromancer_blade', weight:10 },
          { item:'nova_orb', weight:15 },
          { item:'crystal_dagger', weight:8 },
          { item:'energy_shield', weight:12 }
        ]),
        to('box10','Гранд-лотта',1200, [
          { item:'necromancer_blade', weight:12 },
          { item:'laser_sword', weight:20 },
          { item:'wind_wings', weight:14 },
          { item:'energy_shield', weight:12 },
          { item:'plasma_rifle', weight:14 },
          { item:'steel_shield', weight:6 }
        ])
      ];
    })();

    // 3) Апгрейды
    const UPGRADES = [
      { id:'luck', name:'Счастливые руки', price: 120, max:5, level:0,
        desc:'Увеличивает вес предметов (особенно редких).'
      },
      { id:'epicOdds', name:'Эпик-удача', price: 200, max:5, level:0,
        desc:'Увеличивает шанс выпадения эпических и легендарных предметов.'
      },
      { id:'wallet', name:'Кэш-ускорение', price: 150, max:3, level:0,
        desc:'Снижает цену следующих открытий на процент за каждый уровень.'
      }
    ];

    // 4) Стартовые данные
    const STATE_KEY = 'boxforge_state_v1';
    const initialState = {
      currency: 500,
      inventory: {},
      upgrades: { luck: 0, epicOdds: 0, wallet: 0 },
      opened: 0
    };

    // 5) Простейшие утилиты
    function saveState(state){
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }
    function loadState(){
      const s = localStorage.getItem(STATE_KEY);
      if(!s) return null;
      try { return JSON.parse(s); } catch(e){ return null; }
    }
    function currencyFormat(n){
      return Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'RUB', maximumFractionDigits:0 }).format(n);
    }

    // 6) Взаимодействие с DOM
    const root = document.getElementById('boxesGrid');
    const currencyEl = document.getElementById('currencyDisplay');
    const toast = document.getElementById('toast');
    const lootModal = document.getElementById('lootModal');
    const lootIcon = document.getElementById('lootIcon');
    const lootName = document.getElementById('lootName');
    const lootClose = document.getElementById('lootClose');
    const inventoryList = document.getElementById('inventoryList');
    const upgradesList = document.getElementById('upgradesList');
    const resetBtn = document.getElementById('resetBtn');
    const exportBtn = document.getElementById('exportBtn');

    // 7) Логика открытия коробки
    function getItemById(id){
      return ITEMS.find(i => i.id === id);
    }

    function computeLootWeights(loot, upgrades){
      // возвращает массив {itemId, w}
      return loot.map(l => {
        const item = getItemById(l.item);
        const wBase = l.weight;
        let w = wBase;
        // апгрейд luck - увеличивает вес всех предметов
        if (upgrades.luck > 0) {
          w = w * (1 + upgrades.luck * 0.12);
        }
        // эпик/легендарные: epicOdds добавляет к весу для самых редких
        if (item && (item.rarity === 'epic' || item.rarity === 'legendary')) {
          w = w * (1 + upgrades.epicOdds * 0.25);
        }
        return { itemId: l.item, w };
      });
    }

    function weightedPick(choices){
      const total = choices.reduce((a,b)=>a+b.w, 0);
      let r = Math.random() * total;
      for (const c of choices){
        r -= c.w;
        if (r <= 0) return c.itemId;
      }
      // на всякий случай
      return choices[choices.length-1].itemId;
    }

    function showToast(text){
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(()=> toast.classList.remove('show'), 1500);
    }

    function renderInventory(state){
      // очистить
      inventoryList.innerHTML = '';
      // собрать чистый список
      const entries = Object.entries(state.inventory);
      if (entries.length === 0){
        const t = document.createElement('div');
        t.textContent = 'Инвентарь пуст. Открывайте коробки!';
        t.className = 'muted';
        inventoryList.appendChild(t);
        return;
      }
      // показать в виде сетки 2 колонки
      for (const [id, count] of entries){
        const it = getItemById(id);
        const el = document.createElement('div');
        el.className = 'invItem';
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = 'flex-start';
        el.innerHTML = `<span class="icon" style="filter: saturate(120%);">${it?.emoji ?? '🎯'}</span><span>${it?.name ?? id}</span><span style="margin-left:auto" class="muted">x${count}</span>`;
        inventoryList.appendChild(el);
      }
    }

    function renderUpgrades(state){
      upgradesList.innerHTML = '';
      UPGRADES.forEach(u => {
        const lvl = state.upgrades[u.id] ?? 0;
        const price = Math.round(u.price * Math.pow(1.0 + 0.15, lvl));
        const el = document.createElement('div');
        el.className = 'upgrade';
        el.innerHTML = `
          <div class="upgradeInfo">
            <span class="uName">${u.name} <span class="level" title="Уровень">Lv ${lvl}</span></span>
            <span class="uDesc" style="margin-left:6px">${u.desc}</span>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <span class="muted" style="font-weight:700;">${lvl>0? '': ''}цена:</span>
            <span class="muted" style="font-size:12px;">${price} с</span>
            <button class="buy" data-upgrade="${u.id}" ${levelCapReached(lvl, u.max) ? 'disabled' : ''}>Купить</button>
          </div>`;
        upgradesList.appendChild(el);
      });
      // повесить обработчики покупки
      const buttons = upgradesList.querySelectorAll('button.buy');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.getAttribute('data-upgrade');
          purchaseUpgrade(id);
        });
      });
    }

    function levelCapReached(level, max){
      return level >= max ? 'disabled' : '';
    }

    function purchaseUpgrade(id){
      const up = UPGRADES.find(u => u.id === id);
      if (!up) return;
      const state = loadState() || initialState;
      const current = state.upgrades[id] ?? 0;
      if (current >= up.max){
        showToast('Достигнут максимум по этому апгрейду.');
        return;
      }
      const price = Math.round(up.price * Math.pow(1.0 + 0.15, current));
      if (state.currency < price){
        showToast('Не хватает монет для апгрейда.');
        return;
      }
      state.currency -= price;
      state.upgrades[id] = current + 1;
      saveState(state);
      // перерисовать
      renderInventory(state);
      renderUpgrades(state);
      updateCurrencyUI(state.currency);
      showToast('Апгрейд куплен: ' + up.name);
    }

    function updateCurrencyUI(cur){
      currencyEl.textContent = 'Монеты: ' + currencyFormat(cur);
      // обновим также видимые кнопки "Открыть" если нужна
      document.querySelectorAll('.openBtn').forEach(btn => {
        const boxId = btn.getAttribute('data-id');
        const box = BOXES.find(b => b.id === boxId);
        if (!box) return;
        btn.disabled = false;
      });
    }

    // 8) Открытие коробки
    function openBox(boxId){
      const state = loadState() || initialState;
      const box = BOXES.find(b => b.id === boxId);
      if (!box) { showToast('Не найдена коробка.'); return; }

      // вычислим цену с учетом апгрейдов
      const walletLevel = state.upgrades.wallet ?? 0;
      const price = Math.max(1, Math.round(box.price * (1 - walletLevel * 0.05)));

      if (state.currency < price){
        showToast('Не хватает монет для открытия.');
        return;
      }

      // снять валюту
      state.currency -= price;
      saveState(state);
      updateCurrencyUI(state.currency);

      // расчёт лута с учётом апгрейдов
      const loot = computeLootWeights(box.loot, state.upgrades);
      const chosenId = weightedPick(loot);
      const item = getItemById(chosenId) || { id: chosenId, name: chosenId, emoji:'🎲', rarity:'common' };

      // добавить в инвентарь
      if (!state.inventory[item.id]) state.inventory[item.id] = 0;
      state.inventory[item.id] += 1;
      state.opened += 1;
      saveState(state);
      renderInventory(state);

      // анимация открытия
      const card = document.querySelector(`.boxCard[data-id="${boxId}"]`);
      if (card){
        card.classList.add('opening');
        setTimeout(()=> {
          card.classList.remove('opening');
          // показать предмет
          lootIcon.textContent = item.emoji;
          lootName.textContent = `Получено: ${item.name} (${item.rarity})`;
          lootModal.hidden = false;
        }, 650);
      } else {
        // если не нашли карточку, просто покажем модал
        lootIcon.textContent = item.emoji;
        lootName.textContent = `Получено: ${item.name} (${item.rarity})`;
        lootModal.hidden = false;
      }

      // простая карточная анимация частицы может быть добавлена позже
      showToast('Карта получена!');
    }

    // 9) Инициализация и отрисовка
    function renderBoxes(){
      root.innerHTML = '';
      for (const b of BOXES){
        const it = document.createElement('div');
        it.className = 'boxCard';
        it.setAttribute('data-id', b.id);
        // примерный состав карточки
        const firstEmoji = '🎁';
        it.innerHTML = `
          <div class="name" style="display:flex; align-items:center; gap:6px;">
            <span>${b.name}</span>
          </div>
          <div class="icons" aria-label="Иконки">
            <span>${firstEmoji}</span>
          </div>
          <div class="price" style="font-weight:700; margin-top:6px;">
            Цена: ${b.price} монет
          </div>
          <button class="openBtn" data-id="${b.id}">Открыть</button>
        `;
        // обработчик
        const btn = it.querySelector('.openBtn');
        btn.addEventListener('click', () => {
          openBox(b.id);
        });
        root.appendChild(it);
      }
    }

    // 10) Прочее: сброс, экспорт
    function resetState(){
      localStorage.removeItem(STATE_KEY);
      // вернуть в исходник
      const state = JSON.parse(JSON.stringify(initialState));
      // начальная валюта можно задать как 500
      state.currency = 500;
      saveState(state);
      renderInventory(state);
      renderUpgrades(state);
      updateCurrencyUI(state.currency);
      showToast('Прогресс сброшен.');
    }

    function exportState(){
      const s = loadState() || initialState;
      const blob = new Blob([JSON.stringify(s, null, 2)], {type: 'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'boxforge_state.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast('Стейт экспортирован.');
    }

    // 11) Контрольный запуск
    function boot(){
      // загрузить состояние
      let state = loadState();
      if (!state){
        state = JSON.parse(JSON.stringify(initialState));
        saveState(state);
      }
      // отрисовать
      renderBoxes();
      renderInventory(state);
      renderUpgrades(state);
      updateCurrencyUI(state.currency);

      // кнопки
      resetBtn.addEventListener('click', resetState);
      exportBtn.addEventListener('click', exportState);
      lootClose.addEventListener('click', ()=>{ lootModal.hidden = true; });
      // клик по фону модала тоже можно закрывать
      lootModal.addEventListener('click', (e)=> {
        if (e.target === lootModal) lootModal.hidden = true;
      });
    }

    // 12) Попытки исправления: чтобы карточки не ломались через 1-2 пункта
    // Привязать исправные данные в boxes
    // Приведем корректные id предметов в BOXES: удалим несуществующие
    // (в коде BOXES есть несколько "ошибок" временных записей; исправим их)

    // Исправление BOXES: заменяем неизвестные items на существующие
    (function normalizeBoxes(){
      // соберем список валидных item-ids
      const valid = new Set(ITEMS.map(i => i.id));
      BOXES.forEach(b => {
        b.loot = b.loot.map(l => {
          // если item не найден, подставим случайный валидный
          const itemId = valid.has(l.item) ? l.item : ITEMS[0].id;
          return { item: itemId, weight: Math.max(1, l.weight|0) };
        });
      });
    })();

    // Старт
    document.addEventListener('DOMContentLoaded', boot);
  </script>
</body>
